<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | K.D. Hostel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#10264b;--gold:#f5b942}body{min-height:100vh;background:#f3f6fb;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{max-width:460px;width:100%;border:1px solid #e3e9f3;border-radius:20px;box-shadow:0 16px 45px #10264b12}.brand{background:var(--navy);color:white;border-radius:18px 18px 0 0;padding:24px}.brand span{color:var(--gold)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}.muted{font-size:.9rem;color:#6b7890}
</style></head><body>
<div class="card"><div class="brand"><h1 class="h4 fw-bold mb-1">K.D. <span>HOSTEL</span></h1><div class="small">Secure password reset</div></div><div class="card-body p-4"><h2 class="h5 fw-bold">Create a new password</h2><p class="muted">This private link is single-use and expires after one hour.</p><div id="msg" class="alert d-none" role="alert"></div><form id="form"><label class="form-label" for="password">New password</label><input class="form-control mb-3" id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label class="form-label" for="confirm">Confirm new password</label><input class="form-control mb-3" id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><div class="muted mb-3">Use 12–128 characters. Do not share your password.</div><button id="submit" class="btn btn-gold w-100" type="submit">Reset password</button></form><a class="d-block text-center mt-3" href="login.html">Return to login</a></div></div>
<script>
(()=>{'use strict';const API='https://kd-hostel-website.onrender.com';const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('token')||'';function message(t,type){const m=$('msg');m.className='alert alert-'+type;m.textContent=t}if(!token){message('Reset token is missing. Ask the hostel admin for a new link.','danger');$('submit').disabled=true} $('form').addEventListener('submit',async e=>{e.preventDefault();const password=$('password').value;if(password.length<12||password.length>128){message('Password must contain 12–128 characters.','warning');return}if(password!==$('confirm').value){message('Passwords do not match.','warning');return}$('submit').disabled=true;$('submit').textContent='Please wait…';try{const r=await fetch(API+'/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:password})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Password reset failed.');message('Password reset successfully. You can now log in.','success');$('form').reset();$('submit').textContent='Password reset complete'}catch(err){message(err.message||'Could not connect to the server. Please try again.','danger');$('submit').disabled=false;$('submit').textContent='Reset password'}})})();
</script></body></html>
