
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | K.D. Hostel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><img src="../images/kd-hostel-logo.png" alt="K.D. Hostel" height="40"> Admin Dashboard</a><button id="logoutBtn" class="btn btn-outline-light">Logout</button></div></nav>
<main class="container py-4">
  <h1>Admin Dashboard</h1>
  <p class="text-muted">K.D. Hostel Management System</p>
  <div id="status" class="alert alert-info" role="status">Verifying administrator access...</div>
  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="card p-4 h-100"><i class="bi bi-people fs-2"></i><h5 class="mt-2">Students</h5><p id="studentCount" class="fs-3 mb-0">—</p></div></div>
    <div class="col-md-4"><div class="card p-4 h-100"><i class="bi bi-door-closed fs-2"></i><h5 class="mt-2">Room Allocations</h5><p id="allocationCount" class="fs-3 mb-0">—</p></div></div>
    <div class="col-md-4"><div class="card p-4 h-100"><i class="bi bi-bell fs-2"></i><h5 class="mt-2">Notices</h5><p id="noticeCount" class="fs-3 mb-0">—</p></div></div>
  </div>
  <div class="card p-3">
    <h4>Registered Students</h4>
    <div class="table-responsive"><table class="table table-striped">
      <thead><tr><th>Name</th><th>Email</th><th>Hostel</th><th>Status</th></tr></thead>
      <tbody id="studentRows"><tr><td colspan="4">Waiting for server...</td></tr></tbody>
    </table></div>
  </div>
</main>
<footer class="footer py-3 text-center"><p class="mb-0">© <span class="current-year"></span> K.D. Hostel</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../javascript/script.js"></script>
<script>
const API = "https://YOUR-BACKEND-URL.onrender.com";

async function loadDashboard() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(API + "/api/admin/dashboard", {
      credentials: "include"
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Admin access denied");

    document.getElementById("studentCount").textContent = data.student_count;
    document.getElementById("allocationCount").textContent = data.allocation_count;
    document.getElementById("noticeCount").textContent = data.notice_count;

    const rows = document.getElementById("studentRows");
    rows.replaceChildren();

    data.students.forEach(student => {
      const tr = document.createElement("tr");
      [student.name, student.email, student.hostel, student.status].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });

    status.className = "alert alert-success";
    status.textContent = "Administrator access verified.";
  } catch (err) {
    status.className = "alert alert-warning";
    status.textContent = err.message.includes("Failed to fetch")
      ? "Backend not connected. Update the API URL and deploy Flask."
      : err.message;
  }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await fetch(API + "/api/logout", {
      method: "POST",
      credentials: "include"
    });
  } finally {
    window.location.href = "login.html";
  }
});

loadDashboard();
</script>
</body>
</html>
