<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | K.D. Hostel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body { background: #f4f7fc; }
    .auth-section {
      min-height: 78vh;
      display: flex;
      align-items: center;
      padding: 45px 0;
    }
    .auth-card {
      max-width: 470px;
      width: 100%;
      margin: auto;
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(16, 38, 75, .10);
    }
    .auth-logo {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }
    .auth-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      background: #eef3ff;
      color: #2155cd;
      border-radius: 18px;
      font-size: 28px;
    }
    .auth-card .form-control { padding: 12px; }
    .auth-card .btn-primary {
      background: #2155cd;
      border-color: #2155cd;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <img src="../images/kd-hostel-logo.png" alt="K.D. Hostel logo" width="45" height="45">
      <span class="brand-text">K.D. Hostel</span>
    </a>
    <a href="index.html" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-house me-1"></i>Home
    </a>
  </div>
</nav>

<main class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <img src="../images/kd-hostel-logo.png" alt="K.D. Hostel" class="auth-logo mb-3">
        <div class="auth-icon"><i class="bi bi-person-lock"></i></div>
        <h1 class="h3 fw-bold">Student Login</h1>
        <p class="text-secondary">Sign in to your hostel account</p>
      </div>

      <div class="alert alert-warning small" role="status">
        <i class="bi bi-info-circle me-1"></i>
        Demo page: secure login is not connected yet. Do not enter a real password.
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email"
            autocomplete="username" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password"
              autocomplete="current-password" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
              aria-label="Show password" aria-pressed="false">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>

      <div id="loginMessage" class="alert alert-info mt-3 d-none" role="status"></div>

      <p class="text-center mt-4 mb-0">
        New student?
        <a href="register.html" class="fw-semibold">Create an account</a>
      </p>
      <p class="text-center mt-3 mb-0">
        <a href="contact.html">Need help? Contact the hostel</a>
      </p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container text-center py-3">
    <p class="mb-0">&copy; <span id="currentYear"></span> K.D. Hostel, Patan.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../javascript/script.js"></script>
<script>
  const passwordField = document.getElementById("password");
  const toggleButton = document.getElementById("togglePassword");

  toggleButton.addEventListener("click", function () {
    const show = passwordField.type === "password";
    passwordField.type = show ? "text" : "password";
    toggleButton.innerHTML = show
      ? '<i class="bi bi-eye-slash"></i>'
      : '<i class="bi bi-eye"></i>';
    toggleButton.setAttribute("aria-label", show ? "Hide password" : "Show password");
    toggleButton.setAttribute("aria-pressed", String(show));
  });

  document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();
    const message = document.getElementById("loginMessage");
    message.textContent = "Login is a demo only. Connect a secure backend before signing in to real accounts.";
    message.classList.remove("d-none");
  });
</script>
</body>
</html>
