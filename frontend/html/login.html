<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | K.D. Hostel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><img src="../images/kd-hostel-logo.png" alt="K.D. Hostel" height="40"> K.D. Hostel</a><a href="index.html" class="btn btn-outline-light">Home</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card p-4 shadow-sm">
    <h2 class="text-center">Student Login</h2><p class="text-center text-muted">Login to your hostel account</p>
    <div id="message" class="alert d-none" role="status"></div>
    <form id="loginForm">
      <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" class="form-control" type="email" autocomplete="username" required></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" class="form-control" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New student? <a href="register.html">Register here</a></p>
  </div>
</div></div></main>
<footer class="footer py-3 text-center"><p class="mb-0">© <span class="current-year"></span> K.D. Hostel</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../javascript/script.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const box = document.getElementById("message");
  box.className = "alert alert-info";
  box.textContent = "Connecting to backend...";
  try {
    const res = await fetch("https://YOUR-BACKEND-URL.onrender.com/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "include",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    window.location.href = data.role === "admin" ? "admin-dashboard.html" : "student-dashboard.html";
  } catch (err) {
    box.className = "alert alert-danger";
    box.textContent = err.message.includes("Failed to fetch")
      ? "Backend is not connected. Replace the placeholder backend URL first."
      : err.message;
  }
});
</script>
</body>
</html>
