<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10264b">
  <title>Reset Password | K.D. Hostel</title>

  <link rel="icon" type="image/png"
        href="../images/kd-hostel-logo.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root {
      --navy: #10264b;
      --blue: #2456a6;
      --light: #f2f5fb;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: linear-gradient(135deg, #edf3ff, #f8faff);
      font-family: system-ui, Arial, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(16, 38, 75, .12);
    }

    .brand-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: var(--navy);
      font-size: 26px;
      font-weight: 750;
    }

    .form-label {
      color: var(--navy);
      font-weight: 600;
    }

    .form-control {
      min-height: 48px;
      border-radius: 10px;
    }

    .btn-reset {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      font-weight: 650;
    }

    .btn-reset:hover {
      background: var(--blue);
      color: #fff;
    }

    #message {
      overflow-wrap: anywhere;
    }

    .small-note {
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <div class="text-center mb-4">
      <img class="brand-logo"
           src="../images/kd-hostel-logo.png"
           alt="K.D. Hostel logo"
           onerror="this.style.display='none'">

      <h1>Reset Your Password</h1>
      <p class="text-secondary mb-0">
        K.D. Hostel Student Portal
      </p>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <div id="invalidBox" class="text-center d-none">
      <p class="text-danger">
        This reset link is invalid, expired, or already used.
      </p>
      <p class="small-note">
        Please contact the hostel administrator to request a new link.
      </p>
    </div>

    <form id="resetForm" novalidate>
      <div class="mb-3">
        <label for="password" class="form-label">
          New Password
        </label>
        <input type="password" id="password"
               class="form-control"
               minlength="12" maxlength="128"
               autocomplete="new-password"
               placeholder="Enter a new password"
               required>
        <div class="form-text">
          Use 12–128 characters.
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">
          Confirm New Password
        </label>
        <input type="password" id="confirmPassword"
               class="form-control"
               minlength="12" maxlength="128"
               autocomplete="new-password"
               placeholder="Enter the password again"
               required>
      </div>

      <button id="submitBtn" type="submit"
              class="btn btn-reset w-100">
        Reset Password
      </button>
    </form>

    <p class="small-note text-center mt-4 mb-0">
      For your security, never share your reset link or password.
    </p>
  </main>

  <script>
    // Your deployed Flask backend
    const API_BASE = "https://kd-hostel-website.onrender.com/api";

    const token = new URLSearchParams(
      window.location.search
    ).get("token");

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const invalidBox = document.getElementById("invalidBox");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "alert alert-" + type;
    }

    function showInvalid() {
      form.classList.add("d-none");
      invalidBox.classList.remove("d-none");
    }

    async function verifyToken() {
      if (!token) {
        showInvalid();
        return;
      }

      try {
        const response = await fetch(
          API_BASE + "/password-reset/verify",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token: token })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.valid === false) {
          showInvalid();
        }
      } catch (error) {
        showMessage(
          "Could not connect to the server. Please reload and try again.",
          "danger"
        );
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.className = "alert d-none";

      if (!token) {
        showInvalid();
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 12 || password.length > 128) {
        showMessage(
          "Password must contain 12–128 characters.",
          "warning"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match. Please try again.",
          "warning"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating Password...";

      try {
        const response = await fetch(
          API_BASE + "/password-reset",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token: token,
              password: password,
              confirm_password: confirmPassword
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          showMessage(
            data.error || "Password reset failed. Request a new link if needed.",
            "danger"
          );
          if (response.status === 400 || response.status === 401 ||
              response.status === 404 || response.status === 410) {
            showInvalid();
          }
          return;
        }

        form.classList.add("d-none");
        showMessage(
          "Password changed successfully. You can now log in with your new password.",
          "success"
        );
      } catch (error) {
        showMessage(
          "Server connection failed. Please try again.",
          "danger"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Reset Password";
      }
    });

    verifyToken();
  </script>
</body>
        </html>
