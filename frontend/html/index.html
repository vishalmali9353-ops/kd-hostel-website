
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>503 Service Unavailable | K.D. Hostel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #202124;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.error-container {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    padding: 35px;
    border-radius: 12px;
    border: 1px solid #dadce0;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.error-icon {
    font-size: 45px;
    margin-bottom: 20px;
}

h1 {
    font-size: 25px;
    margin-bottom: 12px;
    color: #202124;
}

.error-code {
    display: inline-block;
    background: #fce8e6;
    color: #c5221f;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 20px;
}

p {
    font-size: 15px;
    line-height: 1.7;
    color: #5f6368;
    margin-bottom: 12px;
}

.footer {
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px solid #eeeeee;
    color: #80868b;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="error-container">

    <div class="error-icon">⚠️</div>

    <div class="error-code">
        HTTP ERROR 503
    </div>

    <h1>Service Unavailable</h1>

    <p>
        The K.D. Hostel website is temporarily unavailable.
        Please try again later.
    </p>

    <p>
        We apologize for the inconvenience.
    </p>

    <div class="footer">
        K.D. Hostel Management System
    </div>

</div>

</body>
</html>
