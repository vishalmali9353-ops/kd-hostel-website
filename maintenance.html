<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hostel Maintenance Prediction</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏠 Hostel Maintenance Predictor</h1>
    <p class="subtitle">Predict when a hostel asset will need maintenance</p>

    <form id="predict-form">
      <label>Asset Name
        <input type="text" id="asset_name" placeholder="e.g. Room 204 - Ceiling Fan" required>
      </label>

      <label>Equipment Age (months)
        <input type="number" id="equipment_age_months" min="0" step="0.1" required>
      </label>

      <label>Usage (hours/day)
        <input type="number" id="usage_hours_per_day" min="0" max="24" step="0.1" required>
      </label>

      <label>Days Since Last Service
        <input type="number" id="days_since_last_service" min="0" step="1" required>
      </label>

      <label>Room Occupancy (people)
        <input type="number" id="occupancy_count" min="1" step="1" required>
      </label>

      <button type="submit">Predict Maintenance</button>
    </form>

    <div id="result" class="result hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
