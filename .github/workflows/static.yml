
name: Deploy Hostel Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p public/frontend
          cp -R frontend/html public/frontend/html
          cp -R frontend/css public/frontend/css
          cp -R frontend/javascript public/frontend/javascript
          cp -R frontend/images public/frontend/images
          printf '%s\n' '<!doctype html><html><head><meta http-equiv="refresh" content="0; url=frontend/html/index.html"><title>KD Hostel</title></head><body><a href="frontend/html/index.html">Open KD Hostel Website</a></body></html>' > public/index.html
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
