
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | K.D. Hostel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html"><img src="../images/kd-hostel-logo.png" alt="K.D. Hostel" height="40"> K.D. Hostel</a><a href="login.html" class="btn btn-outline-light">Login</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7">
  <div class="card p-4 shadow-sm">
    <h2 class="text-center">Student Registration</h2><p class="text-center text-muted">Request a hostel account</p>
    <div id="message" class="alert d-none" role="status"></div>
    <form id="registerForm">
      <div class="mb-3"><label for="name" class="form-label">Full Name</label><input id="name" class="form-control" maxlength="100" required></div>
      <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" class="form-control" type="email" maxlength="150" autocomplete="email" required></div>
      <div class="mb-3"><label for="phone" class="form-label">Mobile Number</label><input id="phone" class="form-control" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number" required></div>
      <div class="mb-3"><label for="enrollment" class="form-label">Enrollment Number</label><input id="enrollment" class="form-control" maxlength="30" required></div>
      <div class="mb-3"><label for="hostel" class="form-label">Hostel Preference</label><select id="hostel" class="form-select" required><option value="">Choose hostel</option><option value="boys">Boys Hostel</option><option value="girls">Girls Hostel</option></select></div>
      <div class="mb-3"><label for="password" class="form-label">Create Password</label><input id="password" class="form-control" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Submit Registration</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
  </div>
</div></div></main>
<footer class="footer py-3 text-center"><p class="mb-0">© <span class="current-year"></span> K.D. Hostel</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../javascript/script.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const box = document.getElementById("message");
  box.className = "alert alert-info";
  box.textContent = "Submitting registration...";
  try {
    const res = await fetch("https://YOUR-BACKEND-URL.onrender.com/api/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        enrollment: document.getElementById("enrollment").value.trim(),
        hostel: document.getElementById("hostel").value,
        password: document.getElementById("password").value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Registration failed");
    box.className = "alert alert-success";
    box.textContent = data.message || "Registration submitted.";
    this.reset();
  } catch (err) {
    box.className = "alert alert-danger";
    box.textContent = err.message.includes("Failed to fetch")
      ? "Backend is not connected. Replace the placeholder backend URL first."
      : err.message;
  }
});
</script>
</body>
</html>
